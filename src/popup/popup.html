<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Account Shield</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <img src="../../assets/icons/icon32.png" alt="Shield Logo">
        <h2>Google Account Shield</h2>
    </div>

    <div class="status-card" id="status-card">
        <div class="status-indicator"></div>
        <span id="status-text">Protected</span>
    </div>

    <div class="settings-group">
        <div class="setting-row">
            <div class="setting-info">
                <h3>Hide "Sign out" Button</h3>
                <p>Prevents accidental mass-logout.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle-shield">
                <span class="slider round"></span>
            </label>
        </div>

        <div class="setting-row">
            <div class="setting-info">
                <h3>Unlimited Account Vault</h3>
                <p>Auto-saves sessions in background.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle-vault">
                <span class="slider round"></span>
            </label>
        </div>

        <div class="setting-row">
            <div class="setting-info">
                <h3>Auto-Evict Protection</h3>
                <p>Keeps active sessions below 10.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle-overflow">
                <span class="slider round"></span>
            </label>
        </div>
    </div>

    <div class="stats-card">
        <div class="stat">
            <div class="stat-value" id="vault-count">0</div>
            <div class="stat-label">Saved Accounts</div>
        </div>
    </div>

    <div class="actions">
        <button id="btn-add-account" class="primary-btn">➕ Add New Google Account</button>
        <button id="btn-open-options" class="secondary-btn">⚙️ Open Full Vault Manager</button>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
